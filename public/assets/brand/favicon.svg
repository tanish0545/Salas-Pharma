  </defs>

  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Angled Capsule Emblem -->
  <g transform="translate(32,32) rotate(-45)">
