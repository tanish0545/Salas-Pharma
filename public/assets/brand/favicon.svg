    <line x1="-22" y1="0" x2="22" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Red Lower Capsule Half -->
    <path d="M -22,0 L -22,6 C -22,16 -18,22 -10,22 L 10,22 C 18,22 22,16 22,6 L 22,0 Z" fill="url(#favRed)"/>
    <!-- Medical Cross -->
    <rect x="-3" y="-10" width="6" height="20" rx="1.5" fill="#FFFFFF"/>
    <rect x="-10" y="-3" width="20" height="6" rx="1.5" fill="#FFFFFF"/>
